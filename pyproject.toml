[project]
name = "jwstdetector"
version = "0.3.0"
description = "Unsupervised anomaly detection on JWST imagery with DINO patch embeddings"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "numpy",
  "torch",
  "transformers>=4.56",  # the first release with DINOv3
  "huggingface_hub",
  "astropy",
  "Pillow>=9.1",
  "scipy",
  "tifffile",
  "pandas",
  "PyYAML",
  "tqdm",
  "matplotlib",
]

[project.optional-dependencies]
# viewer.py opens a Qt window when PyQt6 is there, and a Tk one otherwise.
viewer = ["PyQt6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jwstdetector"]
py-modules = [
  "prep_data",
  "run_query_bootstrap",
  "run_anomalydino",
  "summarize_results",
  "unzipper",
  "viewer",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "PIE", "PT", "PTH", "ARG", "RUF", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"test*.py" = ["S", "ARG", "PT", "SLF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.bandit]
skips = ["B101"]
