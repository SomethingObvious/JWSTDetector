[project]
name = "jwst-peculiar"
version = "0.5.0"
description = "Unsupervised anomaly detection on JWST imagery with DINO patch embeddings"
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md"]

dependencies = [
  "numpy",
  "torch>=2.8",  # the first release where torch.mm takes out_dtype
  "transformers>=4.56",  # the first release with DINOv3
  "huggingface_hub",
  "astropy",
  "reproject",  # puts the NIRCam filters on one grid
  "Pillow>=9.1",
  "scipy",
  "tifffile",
  "pandas",
  "PyYAML",
  "tqdm",
  "matplotlib",
  "pyvo",  # SIMBAD, NED and Gaia over TAP for `jwst-peculiar match`
  "photutils",  # finds and measures sources for the colour search
  "scikit-learn",  # the isolation forest baseline in `jwst-peculiar bench`
  "typing_extensions",  # @override on Python 3.11
]

[project.optional-dependencies]
dev = [
  "basedpyright",
  "mypy",
  "pandas-stubs",
  "pre-commit",
  "pytest",
  "ruff",
  "scipy-stubs",
  "stpsf",
  "types-PyYAML",
  "types-tqdm",
]
# STScI's Webb PSF model, which `jwst-peculiar bench` plants sources with when it's installed.
webb = ["stpsf"]

[project.urls]
Demo = "https://somethingobvious.github.io/jwst-peculiar/"
Repository = "https://github.com/SomethingObvious/jwst-peculiar"

[project.scripts]
jwst-peculiar = "jwst_peculiar.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jwst_peculiar"]

[tool.setuptools.package-data]
# The built web viewer, from `npm run build` in web/.
jwst_peculiar = ["viewer_static/**/*"]

[tool.ruff]
line-length = 88
target-version = "py311"
# The training script is kept exactly as it ran for the published weights.
extend-exclude = ["training"]
preview = true

[tool.ruff.lint]
select = ["ALL"]
explicit-preview-rules = true
extend-select = ["DOC201", "DOC202", "DOC402", "DOC403", "DOC501", "PLR0904", "PLR0914", "PLR0916"]
ignore = [
  "COM812",  # the formatter owns trailing commas
  "CPY001",  # the licence is in LICENSE.md
  "D107",
  "D203",
  "D213",
  "FIX002",
  "N803",  # X and Y for arrays, as in numpy and scikit-learn
  "N806",
  "S311",  # seeded generators for reproducible sampling, not secrets
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "PLR2004", "SLF001", "ARG001", "ARG002", "FBT001", "FBT002", "FBT003", "PLC0415", "D", "INP001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 3
max-returns = 4
max-branches = 10
max-statements = 30
max-locals = 12
max-bool-expr = 4
max-nested-blocks = 4
max-public-methods = 15

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pickle".msg = "Use JSON or npz, which can't run code on load."
"typing.Optional".msg = "Write X | None."

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
strict_bytes = true
extra_checks = true
disallow_any_unimported = true
enable_error_code = [
  "redundant-expr",
  "truthy-bool",
  "truthy-iterable",
  "ignore-without-code",
  "unused-awaitable",
  "possibly-undefined",
  "redundant-self",
  "explicit-override",
  "mutable-override",
  "unimported-reveal",
  "narrowed-type-not-subtype",
  "deprecated",
  "exhaustive-match",
]

[[tool.mypy.overrides]]
# No stubs ship for these.
module = ["astropy.*", "photutils.*", "reproject.*", "pyvo.*", "tifffile.*", "safetensors.*", "stpsf.*", "sklearn.*", "transformers.*", "huggingface_hub.*"]
ignore_missing_imports = true

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["jwst_peculiar", "tests"]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false

[tool.vulture]
min_confidence = 60
paths = ["jwst_peculiar", "tests"]

[tool.bandit]
skips = ["B101"]

[tool.typos.default.extend-words]
# The FITS weight extension and its file suffix, a row index, the NASA/IPAC
# Extragalactic Database, Canadian spelling, parts of PNGs and 255ths, and the
# EAZY photometric redshift code.
WHT = "WHT"
wht = "wht"
iy = "iy"
NED = "NED"
uncatalogued = "uncatalogued"
Uncatalogued = "Uncatalogued"
PN = "PN"
ths = "ths"
EAZY = "EAZY"
