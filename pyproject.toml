[project]
name = "jwstdetector"
version = "0.5.0"
description = "Unsupervised anomaly detection on JWST imagery with DINO patch embeddings"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "numpy",
  "torch",
  "transformers>=4.56",  # the first release with DINOv3
  "huggingface_hub",
  "astropy",
  "reproject",  # puts the NIRCam filters on one grid
  "Pillow>=9.1",
  "scipy",
  "tifffile",
  "pandas",
  "PyYAML",
  "tqdm",
  "matplotlib",
  "pyvo",  # SIMBAD, NED and Gaia over TAP for `jwstdetector match`
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
jwstdetector = "jwstdetector.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jwstdetector"]

[tool.setuptools.package-data]
# The built web viewer, from `npm run build` in web/.
jwstdetector = ["viewer_static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "PIE", "PT", "PTH", "ARG", "RUF", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S", "ARG", "PT", "SLF", "N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.bandit]
skips = ["B101"]
