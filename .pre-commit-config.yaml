# pre-commit install --hook-type pre-commit --hook-type pre-push --hook-type commit-msg
default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^jwstdetector/viewer_static/
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        exclude: ^jwstdetector/viewer_static/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/crate-ci/typos
    rev: v1.38.1
    hooks:
      - id: typos
        exclude: ^jwstdetector/viewer_static/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: python -m mypy jwstdetector tests
        language: system
        pass_filenames: false
        types: [python]
      - id: basedpyright
        name: basedpyright
        entry: python -m basedpyright
        language: system
        pass_filenames: false
        types: [python]
      - id: noqa-needs-a-reason
        name: noqa names its rule and says why
        # A bare noqa hides every rule on the line, and one with no reason can't be
        # reviewed later.
        entry: '#\s*noqa(?!: [A-Z]+[0-9]+(, ?[A-Z]+[0-9]+)* \S)'
        language: pygrep
        types: [python]
      - id: no-data
        name: no FITS, arrays or weights
        entry: Data and model files stay out of git. Put them under datasets/ or rawfits/.
        language: fail
        files: \.(fits|fz|npz|npy|pt|pth|safetensors|tif|tiff)$
      - id: no-attribution
        name: no tool attribution in commit messages
        entry: '(?i)(co-authored-by|generated with)'
        language: pygrep
        stages: [commit-msg]
      - id: viewer
        name: viewer checks
        entry: bash -c 'cd web && npm run check && npm run lint && npm run format:check'
        language: system
        pass_filenames: false
        files: ^web/
      - id: tests
        name: tests
        entry: python -m pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
